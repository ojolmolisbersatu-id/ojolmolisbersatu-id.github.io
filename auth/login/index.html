<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00B14F">
<title>Login Anggota — OMB</title>
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<header class="topbar"><div class="nav">
<a class="brand" href="../../"><span class="brand-mark">OMB</span><span>Ojol Molis Bersatu<small>Komunitas Driver Motor Listrik</small></span></a>
<button class="menu" onclick="toggleMenu()">☰</button>
<nav class="navlinks">
<a href="../../">Beranda</a><a href="../../public/agenda/">Agenda</a><a href="../../public/berita/">Berita</a>
<a href="../../public/benefit/">Benefit</a><a href="../../public/mitra/">Mitra</a><a href="../../public/cek-anggota/">Cek Anggota</a>
<a href="../../public/daftar/">Daftar</a>
</nav></div></header>

<main class="container">
<section class="page-head">
<span class="eyebrow">AREA ANGGOTA OMB</span>
<h1>Login Anggota</h1>
<p>Masuk menggunakan email dan password Anda.</p>
</section>
<section class="section"><div class="card form-card">
<form id="loginForm" novalidate>
<label for="email">Email</label>
<input id="email" type="email" inputmode="email" placeholder="nama@email.com" autocomplete="username" autocapitalize="none" required>
<label for="password">Password</label>
<input id="password" type="password" placeholder="Password Anda" autocomplete="current-password" required>
<div class="actions"><button id="loginButton" class="btn" type="submit">Masuk</button><a class="btn secondary" href="../../public/daftar/">Daftar</a></div>
<p id="message" class="msg" style="display:none" role="alert"></p>
</form>
<p style="margin-top:18px"><a href="../lupa-password/">Lupa password?</a></p>
</div></section>
</main>

<footer><div class="footer-inner"><span>© OMB Ojol Molis Bersatu</span><span>Ojol Molis Bersatu</span></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function(){
  var form = document.getElementById('loginForm');
  var emailInput = document.getElementById('email');
  var pwInput = document.getElementById('password');
  var msg = document.getElementById('message');
  var btn = document.getElementById('loginButton');

  function show(text, isError){
    msg.style.display = 'block';
    msg.textContent = text;
    msg.className = 'msg' + (isError === false ? '' : ' error');
  }

  async function route(){
    var access = await OMB.getAccess();
    if (!OMB.isAccountUsable(access)) {
      await OMB.initSupabase().auth.signOut();
      throw new Error('Akun Anda belum aktif atau belum terhubung ke data anggota. Hubungi pengurus.');
    }
    if (access.must_change_password) { location.href = OMB.url('auth/ganti-password/'); return; }
    location.href = OMB.homeFor(access);
  }

  var sb = OMB.initSupabase();
  if (!sb) { show('Layanan belum siap. Muat ulang halaman.'); btn.disabled = true; return; }

  // Sudah punya sesi? langsung arahkan.
  sb.auth.getSession().then(function(r){
    if (r.data && r.data.session) {
      route().catch(function(){ sb.auth.signOut(); });
    }
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.style.display = 'none';
    var email = emailInput.value.trim().toLowerCase();
    var password = pwInput.value;
    if (!email || !password) { show('Isi email dan password.'); return; }

    btn.disabled = true;
    btn.textContent = 'Memproses...';
    try {
      var r = await sb.auth.signInWithPassword({ email: email, password: password });
      if (r.error) {
        var m = (r.error.message || '').toLowerCase();
        if (r.error.status === 429) throw new Error('Terlalu banyak percobaan. Coba lagi beberapa menit lagi.');
        if (m.indexOf('not confirmed') !== -1) throw new Error('Email belum dikonfirmasi. Hubungi pengurus.');
        throw new Error('Email atau password salah.');
      }
      await route();
    } catch (err) {
      console.error(err);
      show(err.message || 'Login gagal.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }
  });
})();
</script>
</body>
</html>
